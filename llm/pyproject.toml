[project]
name = "llm"
version = "0.1.0"
description = "LLM gRPC Service"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=5.29.3",
    "langchain>=0.1.12",
    "langchain-core>=0.1.31",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
artifacts = ["src/**/*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
