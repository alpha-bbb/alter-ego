[project]
name = "llm"
version = "0.1.0"
description = "LLM gRPC Service"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "protobuf>=5.29.3",
    "langchain>=0.3.19",
    "langchain-core>=0.3.40",
    "python-dotenv>=1.0.1",
    "langchain-openai>=0.3.7",
    "langgraph>=0.3.2",
    "langchain-community>=0.3.18",
    "langchain-anthropic>=0.3.8",
    "langchain-google-genai>=2.0.11",
    "pydantic>=2.10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
artifacts = ["src/**/*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.9",
]
