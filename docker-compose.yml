version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "50051:50051"
    env_file:
      - ./backend/.env
    volumes:
      - .:/app
      - /var/log/alter-ego:/var/log/alter-ego
    networks:
      - app_network

  line-backend:
    build:
      context: ./line/backend
    env_file:
      - ./line/backend/.env
    ports:
      - "3000:3000"
    networks:
      - app_network

  llm:
    build:
      context: ./llm
    env_file:
      - ./llm/.env
    ports:
      - "50052:50052"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
