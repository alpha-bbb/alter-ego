services:
  backend:
    build:
      context: ./backend
    ports:
      - "50051:50051"
    env_file:
      - ./backend/.env
    volumes:
      - /var/log/alter-ego:/var/log/alter-ego
    networks:
      - app_network
    depends_on:
      - mongodb

  line-backend:
    build:
      context: ./line/backend
    env_file:
      - ./line/backend/.env
    ports:
      - "3000:3000"
    networks:
      - app_network

  llm:
    build:
      context: ./llm
    env_file:
      - ./llm/.env
    ports:
      - "50052:50052"
    networks:
      - app_network

  mongodb:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - /var/lib/mongo:/data/db
    env_file:
      - ./mongodb/.env
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
