services:
  backend:
    build:
      context: ./backend
    ports:
      - "50051:50051"
    env_file:
      - ./backend/.env
    volumes:
      - /var/log/alter-ego:/var/log/alter-ego
    networks:
      - app_network
    depends_on:
      - postgres

  line-backend:
    build:
      context: ./line/backend
    env_file:
      - ./line/backend/.env
    ports:
      - "3000:3000"
    networks:
      - app_network

  llm:
    build:
      context: ./llm
    env_file:
      - ./llm/.env
    ports:
      - "50052:50052"
    networks:
      - app_network

  postgres:
    image: postgres:17.2
    env_file:
      - ./postgresql/.env
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
