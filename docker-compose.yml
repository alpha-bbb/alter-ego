services:
  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "50051:50051"
      - "50080:50080"
    env_file:
      - ./backend/.env
    volumes:
      - /var/log/alter-ego:/var/log/alter-ego
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  line-backend:
    build:
      context: ./line/backend
      target: prod
    env_file:
      - ./line/backend/.env
    ports:
      - "3000:3000"
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  llm:
    build:
      context: ./llm
      target: prod
    env_file:
      - ./llm/.env
    ports:
      - "50052:50052"
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app_network:
    driver: bridge
