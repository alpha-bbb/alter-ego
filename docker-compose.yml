# 開発環境用
version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "50051:50051"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    command: >
      ash -c "go run main.go"

  line-backend:
    build:
      context: ./line/backend
      dockerfile: Dockerfile
    container_name: line_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    env_file:
      - ./line/backend/.env

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "50052:50052"
    env_file:
      - ./llm/.env
    command: >
      ash -c "node dist/server/index.js"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    restart: always
    depends_on:
      - backend
      - line-backend
      - llm
