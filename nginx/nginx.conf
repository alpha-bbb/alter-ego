events {
    worker_connections 1024; # 最大同時接続数
}

http {
    server {
        listen 443 ssl;

        ssl_certificate     /etc/letsencrypt/live/api.line.alter-ego.jtj.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.line.alter-ego.jtj.jp/privkey.pem;

        server_name api.line.alter-ego.jtj.jp;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;

        server_name api.line.alter-ego.jtj.jp;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
